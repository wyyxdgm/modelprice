# modelprice.damolabs.app — LLM 比价分析工具（纯静态单文件；2026-11-21 按 games.damolabs.app 模板精简）
# 本站无任何 API 端点、无外部资源（数据内嵌 index.html；all.json 为 AI 拉取用导出）。
# 与 games vhost 的差异：
#   - 无自定义 404 页（仓内无 404.html，用 nginx 默认）
#   - 无 .html 无后缀 301 块（仅 method.html 一页，sitemap 用完整文件名）
#   - JSON 块无 Range 特殊处理（all.json 是一次性下载消费，非流媒体）；gzip 保持默认开
server {
    listen 80;
    listen [::]:80;
    server_name modelprice.damolabs.app;
    access_log /www/wwwlogs/modelprice.damolabs.app.log;
    root /www/wwwroot/modelprice.damolabs.app;
    location /.well-known/acme-challenge/ { }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name modelprice.damolabs.app;
    access_log /www/wwwlogs/modelprice.damolabs.app.log;
    root /www/wwwroot/modelprice.damolabs.app;
    index index.html;
    ssl_certificate /var/www/ssl/modelprice.damolabs.app.pem;
    ssl_certificate_key /var/www/ssl/modelprice.damolabs.app.key;

    # P1-7 安全头五项（与 games/cozy 逐行对齐；CSP 纯 self——本站零外部资源，全内嵌）
    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # /index.html → / 消灭重复内容
    location = /index.html { return 301 /; }

    # 数据导出 JSON 不长缓存：数据集更新（weekly 节奏）后 AI/脚本拉取即时生效
    location ~* \.json$ {
        add_header Cache-Control "public, max-age=600" always;
        add_header Strict-Transport-Security "max-age=2592000" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 🔴 games P1-7 try_files 坑沿用修法：必须带 $uri/index.html 兜底，否则 / 会 404
    location / { try_files $uri $uri/index.html =404; }
}
