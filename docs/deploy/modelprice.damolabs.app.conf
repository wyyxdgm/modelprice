# modelprice.damolabs.app — LLM 比价分析工具（纯静态；2026-11-22 仓库化：dist/ 产物整目录 rsync）
# 本站无任何 API 端点、无外部资源（数据内嵌 dist/index.html 的 DATA JSON 块；all.json 为 AI 拉取用导出）。
# 与 games vhost 的差异：
#   - 无自定义 404 页（仓内无 404.html，用 nginx 默认）；root 仍是站点根（dist/ 内容平铺进去，路径不变）
#   - 无 .html 无后缀 301 块（仅 method.html 一页，sitemap 用完整文件名）
#   - JSON 块无 Range 特殊处理（all.json 是一次性下载消费，非流媒体）；gzip 保持默认开
server {
    listen 80;
    listen [::]:80;
    server_name modelprice.damolabs.app;
    access_log /www/wwwlogs/modelprice.damolabs.app.log;
    root /www/wwwroot/modelprice.damolabs.app;
    location /.well-known/acme-challenge/ { }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name modelprice.damolabs.app;
    access_log /www/wwwlogs/modelprice.damolabs.app.log;
    root /www/wwwroot/modelprice.damolabs.app;
    index index.html;
    charset utf-8;
    ssl_certificate /var/www/ssl/modelprice.damolabs.app.pem;
    ssl_certificate_key /var/www/ssl/modelprice.damolabs.app.key;

    # P1-7 安全头五项（与 games/cozy 逐行对齐）。2026-11-22 仓库化后 JS/CSS 全外链 →
    # script-src 收紧回 'self'（去掉 unsafe-inline）；DATA JSON 是 type="application/json"
    # 的 data block（不执行，不受 script-src 管）；style 属性仍需 style-src 的 unsafe-inline。
    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # /index.html → / 消灭重复内容
    location = /index.html { return 301 /; }

    # 🔴 HTML/CSS/JS 一律 no-cache（must-revalidate）：仓库化后 JS/CSS 外链但文件名无 hash，
    #    发版后旧缓存 HTML + 新 CSP（script-src 'self' 无 unsafe-inline）= 旧内联脚本被拦 = 空页
    #    （2026-11-22 上线时实测撞过）。入口与 assets 都让浏览器每次 revalidate（Last-Modified → 304，开销小）。
    #    nginx add_header 继承规则：location 内出现任一 add_header 就不再继承 server 级 → 安全头五项必须整组重复。
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=2592000" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 数据导出 JSON 不长缓存：数据集更新（weekly 节奏）后 AI/脚本拉取即时生效
    location ~* \.json$ {
        add_header Cache-Control "public, max-age=600" always;
        add_header Strict-Transport-Security "max-age=2592000" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 🔴 games P1-7 try_files 坑沿用修法：必须带 $uri/index.html 兜底，否则 / 会 404
    # / 入口同样 no-cache（无扩展名，不会被上面的正则 location 覆盖；add_header 继承规则同前）
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=2592000" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/index.html =404;
    }
}
